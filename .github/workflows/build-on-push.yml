name: Build on Push

on:
  # 只有推送到默认分支才跑构建与发布。这两个 paths-ignore 列表必须保持一致。
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"
      - "env.sample"
      - ".github/**"
  # PR 只做快速校验（见 build-android / build-ios 的 if），构建留给 main。
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"
      - "env.sample"
      - ".github/**"
  workflow_dispatch:

run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title)
      || github.event.head_commit.message || 'Manual build' }}

# 默认只读；写权限仅在真正创建 Release 的 publish job 内单独授予。
permissions:
  contents: read

concurrency:
  # 同一 ref 上后来者取消先到者，避免短时间连续推送堆积构建；
  # 但默认分支不取消，以免腰斩已经进行到一半的 publish。
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: >-
    ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

# Flutter 版本钉定。项目依赖 Dart 3.11 下限，Android 侧还带着 migrator 写入的
# Gradle 兼容标志与 kotlin.incremental=false（与 KGP 版本相关），浮动 channel 会让
# CI 和本地静默漂移。升级时只改这一处，并同步本地 SDK 与 pubspec.lock。
env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

  build-android:
    name: Build Android APK
    needs: test
    # PR 上只跑 test；workflow_dispatch 手动触发时仍会构建，可用于验证某个分支。
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Flutter 的 Gradle 插件只处理 Flutter 侧，Gradle 自身不在其缓存范围内：
      # 不缓存时每次运行都要重新下载 Gradle 发行包（约 150MB，落在 ~/.gradle/wrapper）
      # 和全部依赖（~/.gradle/caches），而 Android 作业里构建步骤占了约 489s，
      # 其中相当一部分是这类重复下载。key 绑定 Gradle 配置文件，改动时自动重建。
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            printf '%s\n' \
              "storePassword=${ANDROID_STORE_PASSWORD}" \
              "keyPassword=${ANDROID_KEY_PASSWORD}" \
              "keyAlias=${ANDROID_KEY_ALIAS}" \
              "storeFile=upload-keystore.jks" > android/key.properties
            echo "Using release keystore from GitHub Secrets."
          else
            echo "No signing secrets configured; building with debug signing."
          fi

      - name: Build release APK
        run: |
          flutter build apk --release --obfuscate --split-debug-info=./debug-info --split-per-abi
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-*-release.apk release-assets/
          cp build/app/outputs/flutter-apk/app-*-release.apk.sha1 release-assets/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-android
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-info-${{ github.run_number }}
          path: debug-info/
          if-no-files-found: error
          retention-days: 90

  build-ios:
    name: Build iOS IPA
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA with Payload
        run: |
          APP_PATH="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Runner.app not found at $APP_PATH"
            exit 1
          fi

          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | tr -d '\r' | cut -d'+' -f1)
          IPA_NAME="JWHelper-${VERSION}-nosign.ipa"

          mkdir -p release-assets Payload
          cp -R "$APP_PATH" Payload/
          zip -qq -r "release-assets/${IPA_NAME}" Payload
          rm -rf Payload
          ls -lh release-assets/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-ios
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish Pre-release
    needs: [build-android, build-ios]
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 唯一需要写权限的 job（创建/更新 GitHub Release）。
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets-android
          path: release-assets

      - name: Download iOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets-ios
          path: release-assets

      - name: Prepare release metadata
        id: meta
        run: |
          DATE=$(TZ=Asia/Shanghai date +'%Y-%m-%d')
          git log -1 --format=%B > release-body.md
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "tag=daily-${DATE}" >> "$GITHUB_OUTPUT"
          ls -lh release-assets/

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.date }}
          commit: ${{ github.sha }}
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: false
          prerelease: true
          generateReleaseNotes: false
          bodyFile: release-body.md
          artifacts: |
            release-assets/*.apk
            release-assets/*.sha1
            release-assets/*.ipa
